name: Temporary BYOK formatter

on:
  push:
    branches:
      - feat/byok-ai-providers

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prettier --write src/components/AiSettings.tsx src/lib/ai-chat.server.ts src/lib/ai-history.functions.ts src/lib/ai-history.types.ts src/lib/ai-provider.server.ts src/lib/assistant.functions.ts src/lib/storage.ts scripts/test-ai-byok-policy.mjs package.json supabase/migrations/20260821103000_ai_byok.sql
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AiSettings.tsx src/lib/ai-chat.server.ts src/lib/ai-history.functions.ts src/lib/ai-history.types.ts src/lib/ai-provider.server.ts src/lib/assistant.functions.ts src/lib/storage.ts scripts/test-ai-byok-policy.mjs package.json supabase/migrations/20260821103000_ai_byok.sql
          git commit -m "style: format BYOK files"
          git push
