name: Generate dependency lock artifact

on:
  push:
    branches: [fix/health-egress-consent-reads]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-progress
      - uses: actions/upload-artifact@v4
        with:
          name: generated-bun-lock
          path: bun.lock
