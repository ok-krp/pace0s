name: AI BYOK checks

on:
  pull_request:
    paths:
      - 'src/lib/ai-*.ts'
      - 'src/components/AiSettings.tsx'
      - 'supabase/migrations/*ai_byok*.sql'
      - 'scripts/test-ai-byok-policy.mjs'
      - 'package.json'

jobs:
  byok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test:byok
      - run: npm run typecheck
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Report lint errors
        if: steps.lint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run lint -- --format compact > /tmp/lint.txt 2>&1 || true
          printf '### BYOK lint diagnostics\n\n```text\n' > /tmp/comment.md
          tail -c 10000 /tmp/lint.txt >> /tmp/comment.md
          printf '\n```' >> /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.html_url }}" --body-file /tmp/comment.md
      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
