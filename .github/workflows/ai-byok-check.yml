name: AI BYOK checks

on:
  pull_request:
    paths:
      - 'src/lib/ai-*.ts'
      - 'src/components/AiSettings.tsx'
      - 'supabase/migrations/*ai_byok*.sql'
      - 'scripts/test-ai-byok-policy.mjs'
      - 'package.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  byok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test:byok
      - run: npm run typecheck
      - name: Lint diagnostics
        id: lint
        continue-on-error: true
        run: npm run lint -- --quiet > /tmp/lint.txt 2>&1
      - name: Publish lint diagnostics
        if: steps.lint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Temporary lint errors only'
            echo
            echo '```text'
            cat /tmp/lint.txt
            echo
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.html_url }}" --body-file /tmp/comment.md
      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
