name: AI BYOK checks

on:
  pull_request:
    paths:
      - 'src/lib/ai-*.ts'
      - 'src/components/AiSettings.tsx'
      - 'supabase/migrations/*ai_byok*.sql'
      - 'scripts/test-ai-byok-policy.mjs'
      - 'package.json'

jobs:
  byok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test:byok
      - run: npm run typecheck
      - run: npm run lint
