name: AI BYOK checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/ai-byok.yml'
      - 'package.json'
      - 'bun.lock'

jobs:
  byok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npm run lint
      # TanStack Router generates src/routeTree.gen.ts during the Vite build.
      # Generate it before TypeScript validates createFileRoute(...).
      - name: Generate route tree and build production bundle
        run: npm run build
      - run: npm run typecheck
      - name: Verify BYOK security policy
        run: node scripts/test-byok-security.mjs
