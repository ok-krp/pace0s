name: AI BYOK checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/ai-byok.yml'
      - 'package.json'

jobs:
  byok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify BYOK security policy
        run: node scripts/test-byok-security.mjs
