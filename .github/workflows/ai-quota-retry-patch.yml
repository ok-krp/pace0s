name: Apply AI quota retry patch

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/ai-quota-retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-quota-retry
      - name: Enable provider retry for transient AI failures
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/ai-chat.server.ts')
          text = path.read_text()
          old = 'const safeWindowed = closeDanglingToolCalls(windowed); const result = streamText({ maxRetries: 0,'
          new = 'const safeWindowed = closeDanglingToolCalls(windowed); const result = streamText({ maxRetries: 4,'
          if old not in text:
              raise SystemExit('Expected streamText configuration was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- src/lib/ai-chat.server.ts; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ai-chat.server.ts
          git commit -m 'fix(ai): retry transient provider quota failures'
          git push