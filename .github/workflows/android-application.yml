name: Pace Native Android Application

on:
  push:
    branches: [application]
    paths:
      - "pace_flutter/**"
      - ".github/workflows/android-application.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android host
        working-directory: pace_flutter
        run: flutter create --platforms=android --org com.paceos --project-name pace .

      - name: Install dependencies
        working-directory: pace_flutter
        run: flutter pub get

      - name: Analyze Dart
        working-directory: pace_flutter
        run: flutter analyze

      - name: Run Dart tests
        working-directory: pace_flutter
        run: flutter test

      - name: Build native Flutter Android APK
        working-directory: pace_flutter
        run: flutter build apk --debug

      - name: Verify APK is a valid Android package
        working-directory: pace_flutter
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          file build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk >/dev/null

      - name: Publish latest Flutter native APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-application-latest --yes --cleanup-tag || true
          gh release create android-application-latest \
            pace_flutter/build/app/outputs/flutter-apk/app-debug.apk#Pace-Android.apk \
            --title "Pace Android — native Flutter latest" \
            --notes "Native Flutter Android build. The interface is compiled into the application and does not load pace0s.lovable.app or use a WebView as its frontend." \
            --target "${GITHUB_SHA}"