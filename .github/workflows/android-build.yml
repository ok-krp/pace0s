name: Android build

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: >-
            cd android; set +e; gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace; status=$?; if [ $status -ne 0 ]; then mkdir -p test-diagnostics; adb -s emulator-5554 logcat -d -v threadtime > test-diagnostics/logcat.txt || true; cp -r app/build/reports/androidTests/connected/debug test-diagnostics/test-report || true; cp -r app/build/outputs/androidTest-results/connected test-diagnostics/test-results || true; fi; exit $status

      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paceos-android-test-diagnostics
          path: android/test-diagnostics
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paceos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
