name: PaceOS Android Health Connect

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/lib/health-connect-bridge.ts"
      - "src/components/HealthConnectDiagnostics.tsx"
      - ".github/workflows/android-health-connect.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Android lint/compile check
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paceos-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
