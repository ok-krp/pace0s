name: Cloud Sync Audit

on:
  pull_request:
    paths:
      - "src/hooks/use-cloud-sync-engine.tsx"
      - "src/hooks/use-cloud-sync.tsx"
      - "src/lib/storage.ts"
      - "supabase/migrations/**"
      - "scripts/cloud-sync-contract-test.mjs"
      - "scripts/real-auth-multi-device-test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/cloud-sync-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/hooks/use-cloud-sync-engine.tsx"
      - "src/hooks/use-cloud-sync.tsx"
      - "src/lib/storage.ts"
      - "supabase/migrations/**"
      - "scripts/cloud-sync-contract-test.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/cloud-sync-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:sync
      # TanStack Router generates src/routeTree.gen.ts during the Vite build.
      # Run the build before typecheck so newly added file routes are included.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint

  real-auth-multi-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Real-auth multi-device Realtime test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.PACEOS_E2E_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.PACEOS_E2E_PASSWORD }}
        run: bun --experimental-strip-types scripts/real-auth-multi-device-test.ts
