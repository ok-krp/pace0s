name: Cloud Sync Audit

on:
  pull_request:
    paths:
      - "src/hooks/use-cloud-sync-engine.tsx"
      - "src/hooks/use-cloud-sync.tsx"
      - "src/lib/storage.ts"
      - "supabase/migrations/**"
      - "scripts/cloud-sync-contract-test.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/cloud-sync-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/hooks/use-cloud-sync-engine.tsx"
      - "src/hooks/use-cloud-sync.tsx"
      - "src/lib/storage.ts"
      - "supabase/migrations/**"
      - "scripts/cloud-sync-contract-test.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/cloud-sync-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:sync
      # TanStack Router generates src/routeTree.gen.ts during the Vite build.
      # Run the build before typecheck so newly added file routes are included.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
