name: Apply add_food approval client fix

on:
  push:
    branches:
      - fix/ai-add-food-approval-loop

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-add-food-approval-loop
          fetch-depth: 1
      - name: Patch approval continuation
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/ai.$agentType.$conversationId.tsx')
          s = p.read_text()
          old_import = 'import { DefaultChatTransport, type UIMessage } from "ai";'
          new_import = 'import { DefaultChatTransport, lastAssistantMessageIsCompleteWithApprovalResponses, type UIMessage } from "ai";'
          old_hook = 'useChat({ id: conversationId, messages: initialMessages, transport, throttle: 40, onFinish:'
          new_hook = 'useChat({ id: conversationId, messages: initialMessages, transport, throttle: 40, sendAutomaticallyWhen: lastAssistantMessageIsCompleteWithApprovalResponses, onFinish:'
          if old_import not in s:
              raise SystemExit('expected import not found')
          if old_hook not in s:
              raise SystemExit('expected useChat call not found')
          s = s.replace(old_import, new_import, 1)
          s = s.replace(old_hook, new_hook, 1)
          p.write_text(s)
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/fix-add-food-approval-client.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/ai.$agentType.$conversationId.tsx .github/workflows/fix-add-food-approval-client.yml
          git commit -m 'fix(ai): auto-submit after tool approval'
          git push origin HEAD:fix/ai-add-food-approval-loop
