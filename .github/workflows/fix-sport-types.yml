name: Fix Sport tool typing

on:
  push:
    branches:
      - feat/local-ai-adaptive-fallback

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'fix(ci): normalize sport tool typing') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize Sport tool typing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/sport-ai-tools.ts')
          s = p.read_text()
          s = s.replace('import type { Database, Json } from "@/integrations/supabase/types";\n\n', '')
          s = s.replace('type Client = SupabaseClient<Database>;', 'type Client = SupabaseClient<any>;')
          start = 'function logged<Input>(name: string, execute: (input: Input, options: ToolExecutionOptions<unknown>) => Promise<Output>) {'
          s = s.replace(start, 'function logged(name: string, execute: (input: any, options: ToolExecutionOptions<unknown>) => Promise<Output>) {')
          s = s.replace('return async (input: Input, options: ToolExecutionOptions<unknown>) => {', 'return async (input: any, options: ToolExecutionOptions<unknown>) => {')
          s = s.replace('  const denied = <Input,>() => logged<Input>("sport_permission", async () => ({ ok: false, message: "Permission Sport désactivée." }));\n', '')
          old = '  const guard = <Input>(name: string, execute: (input: Input, options: ToolExecutionOptions<unknown>) => Promise<Output>) =>\n    logged(name, async (input, options) => permissionsEnabled ? execute(input, options) : { ok: false, message: "Permission Sport désactivée." });'
          new = '  const guard = (name: string, execute: (input: any, options: ToolExecutionOptions<unknown>) => Promise<Output>) =>\n    logged(name, async (input, options) => permissionsEnabled ? execute(input, options) : { ok: false, message: "Permission Sport désactivée." });'
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/sport-ai-tools.ts
          git diff --cached --quiet || git commit -m 'fix(ci): normalize sport tool typing'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-sport-types.yml
          git commit -m 'chore(ci): remove temporary sport typing workflow'
          git push
