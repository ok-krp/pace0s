name: Pace Native Flutter

concurrency:
  # Share a group between push and pull_request runs for the same head branch.
  group: pace-native-${{ github.head_ref || github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:
  push:
    paths:
      - 'pace_flutter/**'
      - '.github/workflows/flutter-native.yml'
  pull_request:
    paths:
      - 'pace_flutter/**'
      - '.github/workflows/flutter-native.yml'

permissions:
  contents: read

jobs:
  supabase-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      configured: ${{ steps.endpoint.outputs.configured }}
    steps:
      - name: Check Supabase endpoint DNS before labelling artifacts as cloud
        id: endpoint
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import socket
          import sys
          import time
          from urllib.parse import urlparse

          url = os.environ.get("SUPABASE_URL", "").strip()
          key = os.environ.get("SUPABASE_PUBLISHABLE_KEY", "").strip()
          output_path = os.environ["GITHUB_OUTPUT"]

          def set_output(value):
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write(f"configured={value}\n")

          if not url or not key:
              print("::warning::Supabase URL/key missing; builds will be explicitly offline/local-only.")
              set_output("false")
              sys.exit(0)

          try:
              parsed = urlparse(url)
              host = parsed.hostname
              port = parsed.port
          except ValueError:
              print("::warning::SUPABASE_URL is malformed; builds will be offline/local-only.")
              set_output("false")
              sys.exit(0)

          if (
              parsed.scheme != "https"
              or not host
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
              or parsed.username is not None
              or parsed.password is not None
              or port is not None
          ):
              print("::warning::SUPABASE_URL is not a clean HTTPS project URL; builds will be offline/local-only.")
              set_output("false")
              sys.exit(0)

          # This app is configured with a Supabase project URL, not an arbitrary
          # HTTPS host. Never label a typo or unrelated host as a cloud build
          # merely because its DNS happens to resolve.
          if not host.endswith(".supabase.co"):
              print("::warning::SUPABASE_URL must use the standard *.supabase.co project hostname; builds will be offline/local-only.")
              set_output("false")
              sys.exit(0)

          project_ref = host[:-len(".supabase.co")]
          if not re.fullmatch(r"[a-z0-9]{20}", project_ref):
              print("::warning::Supabase project reference must be 20 lowercase alphanumeric characters; builds will be offline/local-only.")
              set_output("false")
              sys.exit(0)

          last_error = None
          for attempt in range(3):
              try:
                  socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                  last_error = None
                  break
              except socket.gaierror as error:
                  last_error = error
                  if attempt < 2:
                      time.sleep(2)

          if last_error is not None:
              print(f"::warning::Supabase hostname {host} does not resolve from GitHub Actions ({last_error}); cloud configuration will not be embedded in release artifacts.")
              set_output("false")
              sys.exit(0)

          print(f"Supabase hostname {host} resolves; cloud configuration can be embedded.")
          set_output("true")
          PY

  android:
    needs: supabase-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Android host
        working-directory: pace_flutter
        run: flutter create --platforms=android --org com.paceos --project-name pace .
      - name: Remove generated Flutter sample test
        working-directory: pace_flutter
        run: rm -f test/widget_test.dart
      - name: Configure Android native services
        working-directory: pace_flutter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permissions = '''\n    <uses-permission android:name="android.permission.health.READ_STEPS" />\n    <uses-permission android:name="android.permission.health.READ_ACTIVE_CALORIES_BURNED" />\n    <uses-permission android:name="android.permission.health.READ_HEART_RATE" />\n    <uses-permission android:name="android.permission.health.READ_SLEEP" />\n    <uses-permission android:name="android.permission.health.READ_WEIGHT" />\n    <uses-permission android:name="android.permission.health.READ_EXERCISE" />\n    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n'''
          if 'android.permission.health.READ_STEPS' not in text:
              text = text.replace('<application', permissions + '    <application', 1)
          queries = '\n    <queries><package android:name="com.google.android.apps.healthdata" /></queries>\n'
          if '<queries>' not in text:
              text = text.replace('</manifest>', queries + '</manifest>')
          p.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          # The health plugin requires Android API 26+. Flutter's generated
          # template defaults to flutter.minSdkVersion, which is currently 24.
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          if 'minSdk = 26' not in text:
              text = text.replace('defaultConfig {', 'defaultConfig {\n        minSdk = 26', 1)
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dependency not in text:
              if 'dependencies {' in text:
                  text = text.replace('dependencies {', 'dependencies {\n    ' + dependency, 1)
              else:
                  text += '\n\ndependencies {\n    ' + dependency + '\n}\n'
          gradle.write_text(text)
          PY
      - name: Get dependencies
        working-directory: pace_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: pace_flutter
        run: flutter analyze
      - name: Test
        working-directory: pace_flutter
        run: flutter test --reporter expanded --timeout 2m
      - name: Install Android NDK with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          ndk_is_valid() {
            [ -f "${NDK_DIR}/source.properties" ] &&
              grep -Eq '^[[:space:]]*Pkg[.]Revision[[:space:]]*=[[:space:]]*28[.]2[.]13676358[[:space:]]*$' "${NDK_DIR}/source.properties" &&
              [ -x "${NDK_DIR}/ndk-build" ] &&
              [ -x "${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]
          }
          for attempt in 1 2 3; do
            if ndk_is_valid; then
              echo "NDK ${NDK_VERSION} passed revision and toolchain validation"
              exit 0
            fi
            # Never reuse a partially extracted or corrupt NDK directory.
            rm -rf "${NDK_DIR}"
            yes | "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --install "ndk;${NDK_VERSION}" || true
            if ndk_is_valid; then
              echo "NDK ${NDK_VERSION} installed and validated"
              exit 0
            fi
            echo "::warning::NDK installation attempt ${attempt}/3 failed validation; removing partial files before retry"
            rm -rf "${NDK_DIR}"
            sleep $((attempt * 5))
          done
          echo "::error::Unable to install Android NDK ${NDK_VERSION} after 3 attempts"
          exit 1
      - name: Validate Supabase build configuration
        id: supabase_config
        shell: bash
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: |
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase configuration is missing, malformed, or DNS-unreachable. Native artifacts will be labelled offline and built without the cloud endpoint/key."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: pace_flutter
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: flutter build apk --release "--dart-define=SUPABASE_URL=$SUPABASE_URL" "--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: pace-android-apk-${{ steps.supabase_config.outputs.configured == 'true' && 'cloud' || 'offline' }}
          path: pace_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Build AAB
        working-directory: pace_flutter
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: flutter build appbundle --release "--dart-define=SUPABASE_URL=$SUPABASE_URL" "--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
      - name: Publish AAB
        uses: actions/upload-artifact@v4
        with:
          name: pace-android-aab-${{ steps.supabase_config.outputs.configured == 'true' && 'cloud' || 'offline' }}
          path: pace_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  linux:
    needs: supabase-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Generate Flutter Linux host
        working-directory: pace_flutter
        run: flutter create --platforms=linux --org com.paceos --project-name pace .
      - name: Remove generated Flutter sample test
        working-directory: pace_flutter
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        working-directory: pace_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: pace_flutter
        run: flutter analyze
      - name: Test
        working-directory: pace_flutter
        run: flutter test --reporter expanded --timeout 2m
      - name: Validate Supabase build configuration
        id: supabase_config
        shell: bash
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: |
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase configuration is missing, malformed, or DNS-unreachable. Native artifacts will be labelled offline and built without the cloud endpoint/key."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Linux
        working-directory: pace_flutter
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: flutter build linux --release "--dart-define=SUPABASE_URL=$SUPABASE_URL" "--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
      - name: Publish Linux build
        uses: actions/upload-artifact@v4
        with:
          name: pace-linux-${{ steps.supabase_config.outputs.configured == 'true' && 'cloud' || 'offline' }}
          path: pace_flutter/build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    needs: supabase-preflight
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Windows host
        working-directory: pace_flutter
        run: flutter create --platforms=windows --org com.paceos --project-name pace .
      - name: Remove generated Flutter sample test
        working-directory: pace_flutter
        run: Remove-Item -Force test/widget_test.dart -ErrorAction SilentlyContinue
      - name: Get dependencies
        working-directory: pace_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: pace_flutter
        run: flutter analyze
      - name: Test
        working-directory: pace_flutter
        run: flutter test --reporter expanded --timeout 2m
      - name: Validate Supabase build configuration
        id: supabase_config
        shell: bash
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: |
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase configuration is missing, malformed, or DNS-unreachable. Native artifacts will be labelled offline and built without the cloud endpoint/key."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Windows
        working-directory: pace_flutter
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: flutter build windows --release "--dart-define=SUPABASE_URL=$env:SUPABASE_URL" "--dart-define=SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY"
      - name: Publish Windows build
        uses: actions/upload-artifact@v4
        with:
          name: pace-windows-${{ steps.supabase_config.outputs.configured == 'true' && 'cloud' || 'offline' }}
          path: pace_flutter/build/windows/x64/runner/Release
          if-no-files-found: error

  apple:
    needs: supabase-preflight
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Apple hosts
        working-directory: pace_flutter
        run: flutter create --platforms=ios,macos --org com.paceos --project-name pace .
      - name: Remove generated Flutter sample test
        working-directory: pace_flutter
        run: rm -f test/widget_test.dart
      - name: Configure HealthKit usage descriptions
        working-directory: pace_flutter
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string Pace utilise vos données de santé pour afficher vos tendances." ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSHealthShareUsageDescription Pace utilise vos données de santé pour afficher vos tendances." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSHealthUpdateUsageDescription string Pace utilise vos données de santé pour synchroniser les données autorisées." ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSHealthUpdateUsageDescription Pace utilise vos données de santé pour synchroniser les données autorisées." ios/Runner/Info.plist
          cat > ios/Runner/Runner.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.developer.healthkit</key><true/></dict></plist>
          EOF
      - name: Get dependencies
        working-directory: pace_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: pace_flutter
        run: flutter analyze
      - name: Test
        working-directory: pace_flutter
        run: flutter test --reporter expanded --timeout 2m
      - name: Validate Supabase build configuration
        id: supabase_config
        shell: bash
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: |
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase configuration is missing, malformed, or DNS-unreachable. Native artifacts will be labelled offline and built without the cloud endpoint/key."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build iOS
        working-directory: pace_flutter
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: flutter build ios --release --no-codesign "--dart-define=SUPABASE_URL=$SUPABASE_URL" "--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
      - name: Publish iOS build
        uses: actions/upload-artifact@v4
        with:
          name: pace-ios-${{ steps.supabase_config.outputs.configured == 'true' && 'cloud' || 'offline' }}
          path: pace_flutter/build/ios/iphoneos/Runner.app
          if-no-files-found: error
      - name: Build macOS
        working-directory: pace_flutter
        env:
          SUPABASE_URL: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_URL || vars.SUPABASE_URL) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase-preflight.outputs.configured == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY) || '' }}
        run: flutter build macos --release "--dart-define=SUPABASE_URL=$SUPABASE_URL" "--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
      - name: Publish macOS build
        uses: actions/upload-artifact@v4
        with:
          name: pace-macos-${{ steps.supabase_config.outputs.configured == 'true' && 'cloud' || 'offline' }}
          path: pace_flutter/build/macos/Build/Products/Release/pace.app
          if-no-files-found: error
