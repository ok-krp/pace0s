name: Pace Native Flutter

on:
  workflow_dispatch:
  push:
    paths:
      - 'pace_flutter/**'
      - '.github/workflows/flutter-native.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Android host
        working-directory: pace_flutter
        run: flutter create --platforms=android --project-name pace .
      - name: Get dependencies
        working-directory: pace_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: pace_flutter
        run: flutter analyze
      - name: Test
        working-directory: pace_flutter
        run: flutter test
      - name: Build APK
        working-directory: pace_flutter
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: pace-android-apk
          path: pace_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Generate Flutter Linux host
        working-directory: pace_flutter
        run: flutter create --platforms=linux --project-name pace .
      - name: Get dependencies
        working-directory: pace_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: pace_flutter
        run: flutter analyze
      - name: Test
        working-directory: pace_flutter
        run: flutter test
      - name: Build Linux
        working-directory: pace_flutter
        run: flutter build linux --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish Linux build
        uses: actions/upload-artifact@v4
        with:
          name: pace-linux
          path: pace_flutter/build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Windows host
        working-directory: pace_flutter
        run: flutter create --platforms=windows --project-name pace .
      - name: Get dependencies
        working-directory: pace_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: pace_flutter
        run: flutter analyze
      - name: Test
        working-directory: pace_flutter
        run: flutter test
      - name: Build Windows
        working-directory: pace_flutter
        run: flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish Windows build
        uses: actions/upload-artifact@v4
        with:
          name: pace-windows
          path: pace_flutter/build/windows/x64/runner/Release
          if-no-files-found: error

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Apple hosts
        working-directory: pace_flutter
        run: flutter create --platforms=ios,macos --project-name pace .
      - name: Get dependencies
        working-directory: pace_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: pace_flutter
        run: flutter analyze
      - name: Test
        working-directory: pace_flutter
        run: flutter test
      - name: Build iOS
        working-directory: pace_flutter
        run: flutter build ios --release --no-codesign --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish iOS build
        uses: actions/upload-artifact@v4
        with:
          name: pace-ios
          path: pace_flutter/build/ios/iphoneos/Runner.app
          if-no-files-found: error
      - name: Build macOS
        working-directory: pace_flutter
        run: flutter build macos --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish macOS build
        uses: actions/upload-artifact@v4
        with:
          name: pace-macos
          path: pace_flutter/build/macos/Build/Products/Release/pace.app
          if-no-files-found: error
