name: One-shot AI runtime fix
on:
  push:
    branches: [fix/ai-quota-runtime-errors]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Patch AI runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ai-provider.server.ts')
          s = p.read_text()
          old = 'const liveModel = isAllowedModel(provider, model) ? model : defaultModel(provider); const gateway = providerModel(provider, plaintext, liveModel, baseUrl); return { source, provider, model: liveModel, baseUrl, gateway, hasKey: true, keyLast4: secret.key_last4 };'
          new = 'const liveModel = provider === "custom" ? model : await resolveLiveModel(provider, plaintext, normalizeBaseUrl(provider, baseUrl), model); const gateway = providerModel(provider, plaintext, liveModel, baseUrl); return { source, provider, model: liveModel, baseUrl, gateway, hasKey: true, keyLast4: secret.key_last4 };'
          if old not in s:
              raise SystemExit('runtime model selection pattern not found')
          p.write_text(s.replace(old, new, 1))
          s = p.read_text()
          old = 'if (status === 429) return { status: 429, message: "Limite de requêtes atteinte chez votre fournisseur" };'
          new = 'if (status === 429) return { status: 429, message: "Quota ou limite de requêtes atteint chez votre fournisseur IA. Vérifiez votre quota/facturation ou sélectionnez un autre fournisseur." };'
          if old not in s:
              raise SystemExit('429 mapping pattern not found')
          p.write_text(s.replace(old, new, 1))
          p = Path('src/lib/ai-chat.server.ts')
          s = p.read_text()
          s2 = s.replace('const result = streamText({ model: gateway(model), messages:', 'const result = streamText({ maxRetries: 0, model: gateway(model), messages:')
          if s2 == s:
              raise SystemExit('summary streamText pattern not found')
          p.write_text(s2)
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-ai-runtime-fix.yml
          git add src/lib/ai-provider.server.ts src/lib/ai-chat.server.ts
          git commit -m 'fix(ai): handle live models and quota errors without retries'
          git push
