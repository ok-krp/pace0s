name: Patch AI nutrition tasks
on:
  push:
    branches: [fix/ai-nutrition-tasks-persistence]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-nutrition-tasks-persistence
          fetch-depth: 0
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/ai-chat.server.ts'); s = p.read_text()
          old = 'function coachTools(client: Client, userId: string, conversationId: string, permissions: AiPermissions) {'; assert old in s
          s = s.replace(old, 'function coachTools(client: Client, userId: string, conversationId: string, permissions: AiPermissions, requestMessages: readonly unknown[]) {', 1)
          old = '...coachTools(client, userId, conversationId, preferences.permissions),'; assert old in s
          s = s.replace(old, '...coachTools(client, userId, conversationId, preferences.permissions, messages),', 1)
          marker = 'execute: withToolLogging("add_food", async (input, options) => {'; assert marker in s
          guard = '''execute: withToolLogging("add_food", async (input, options) => {\n      const destructive = input.operation === "delete" || input.operation === "remove_ingredients";\n      if (destructive) {\n        const intent = latestUserIntent(requestMessages).toLocaleLowerCase("fr-FR").replace(/[’']/g, "'").replace(/\\s+/g, " ").trim();\n        const explicitRemoval = /\\b(?:supprime|supprimer|efface|effacer|retire|retirer|enlève|enlever)\\b/i.test(intent) && !/\\bne\\s+(?:supprime|supprimer|efface|effacer|retire|retirer|enlève|enlever)\\b/i.test(intent);\n        if (!explicitRemoval) return { ok: true, message: "Aucune suppression effectuée : la demande ne demande pas explicitement de supprimer ou retirer un aliment." };\n      }\n      '''
          s = s.replace(marker, guard, 1); p.write_text(s)

          p = Path('src/components/NutritionDailyAiChat.tsx'); s = p.read_text()
          needle = '  const bottomRef = useRef<HTMLDivElement>(null); const inputRef = useRef<HTMLTextAreaElement>(null);'; assert needle in s
          repl = '''  const [, setNutritionItems] = useDomainState<Record<string, MealItem[]>>("nutrition.items", {});\n  const [, setNutritionTotals] = useDomainState<Record<string, { kcal: number; p: number; c: number; f: number }>>("nutrition.totals", {});\n  const bottomRef = useRef<HTMLDivElement>(null); const inputRef = useRef<HTMLTextAreaElement>(null);'''
          s = s.replace(needle, repl, 1)
          needle = '  const { messages, sendMessage, status, addToolApprovalResponse } = useChat({'; assert needle in s
          helper = '''  const refreshCanonicalNutrition = async () => {\n    const user = (await supabase.auth.getUser()).data.user;\n    if (!user) return;\n    const { data, error } = await supabase.from("food_log").select("id,log_date,meal,name,kcal,protein_g,carbs_g,fat_g,fiber_g,sugar_g,sodium_mg").eq("user_id", user.id).eq("log_date", todayKey()).order("created_at");\n    if (error) throw error;\n    const items = (data ?? []).map((row) => ({ id: row.id, name: row.name, meal: row.meal, kcal: Number(row.kcal ?? 0), p: Number(row.protein_g ?? 0), c: Number(row.carbs_g ?? 0), f: Number(row.fat_g ?? 0), fiber: Number(row.fiber_g ?? 0), sugar: Number(row.sugar_g ?? 0), sodium: Number(row.sodium_mg ?? 0), qty: 1 }));\n    setNutritionItems((current) => ({ ...current, [todayKey()]: items }));\n    setNutritionTotals((current) => ({ ...current, [todayKey()]: items.reduce((a, x) => ({ kcal: a.kcal + x.kcal, p: a.p + x.p, c: a.c + x.c, f: a.f + x.f }), { kcal: 0, p: 0, c: 0, f: 0 }) }));\n  };\n\n  const { messages, sendMessage, status, addToolApprovalResponse } = useChat({'''
          s = s.replace(needle, helper, 1)
          old = 'onFinish: ({ message }) => { void persistNutritionAssistantMessage(conversationId, message).catch((saveError) => console.error("[ai-chat] persistance Nutrition impossible", saveError)); setFailure(null); }'; assert old in s
          s = s.replace(old, 'onFinish: ({ message }) => { void persistNutritionAssistantMessage(conversationId, message).then(() => refreshCanonicalNutrition()).catch((saveError) => console.error("[ai-chat] persistance/refresh Nutrition impossible", saveError)); setFailure(null); }', 1); p.write_text(s)

          p = Path('src/routes/development.tsx'); s = p.read_text()
          old = '  const [tasks, setTasks] = useState<Task[]>([]);'; assert old in s
          s = s.replace(old, old + '\n  const [loadError, setLoadError] = useState<string | null>(null);', 1)
          old = '''      const { data, error } = await supabase.from("development_tasks").select("id,kind,title,description,priority,status").eq("user_id", user.id).order("updated_at", { ascending: false });\n      if (!error && active) setTasks((data ?? []) as Task[]);'''; assert old in s
          new = '''      let { data, error } = await supabase.from("development_tasks").select("id,kind,title,description,priority,status").eq("user_id", user.id).order("updated_at", { ascending: false });\n      if (error) { const fallback = await supabase.from("development_tasks").select("id,kind,title,description,priority,status").eq("user_id", user.id); data = fallback.data; error = fallback.error; }\n      if (active) { if (error) setLoadError(error.message || "Impossible de charger les tâches."); else { setLoadError(null); setTasks((data ?? []) as Task[]); } }'''
          s = s.replace(old, new, 1)
          old = '<div className="grid md:grid-cols-2 gap-3">'; assert old in s
          s = s.replace(old, '<div className="grid md:grid-cols-2 gap-3">{loadError && <div className="glass-card rounded-2xl p-4 text-sm text-destructive md:col-span-2">{loadError} — réessayez en rechargeant la page.</div>}', 1); p.write_text(s)
      - name: Commit and self-delete
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/ai-chat.server.ts src/components/NutritionDailyAiChat.tsx src/routes/development.tsx
          git commit -m "fix: stabilize AI messages nutrition and development tasks"
          git push origin fix/ai-nutrition-tasks-persistence
          rm .github/workflows/patch-ai-nutrition-tasks.yml
          git add .github/workflows/patch-ai-nutrition-tasks.yml
          git commit -m "chore: remove one-time AI nutrition tasks patch workflow"
          git push origin fix/ai-nutrition-tasks-persistence
