name: One-shot AI retry cap patch

on:
  push:
    branches: [fix/ai-provider-runtime-errors]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable provider retry storm
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ai-chat.server.ts')
          s = p.read_text()
          old = 'const result = streamText({ model: runtime.gateway(runtime.model),'
          new = 'const result = streamText({ maxRetries: 0, model: runtime.gateway(runtime.model),'
          if old not in s:
              raise SystemExit('streamText target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai-chat.server.ts
          git commit -m "fix(ai): stop retry storm on provider quota errors"
          git push
