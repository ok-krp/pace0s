name: Patch sport archive UI

on:
  push:
    branches: [feat/sport-archived-programs]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted Sport archive patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/sport.tsx')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'anchor not found: {label}')
              if s.count(old) != 1:
                  raise SystemExit(f'anchor not unique: {label} ({s.count(old)})')
              s = s.replace(old, new)

          replace_once(
              'import { Dumbbell, Plus, Trash2, Play, Square, Check, Pencil, Calendar as CalIcon, History } from "lucide-react";',
              'import { Dumbbell, Plus, Trash2, Play, Square, Check, Pencil, Calendar as CalIcon, History, Archive, ArchiveRestore } from "lucide-react";',
              'lucide import',
          )
          replace_once(
              'type Program = { id: string; name: string; emoji: string; days: number[]; items: ProgramItem[] };',
              'type Program = { id: string; name: string; emoji: string; days: number[]; items: ProgramItem[]; isArchived?: boolean };',
              'Program type',
          )
          replace_once(
              'const todayPrograms = progs.filter((p) => p.days.includes(todayDow));',
              'const todayPrograms = progs.filter((p) => !p.isArchived && p.days.includes(todayDow));',
              'today filter',
          )
          replace_once(
              '<TabsTrigger value="programs" className="text-xs sm:text-sm">Programmes</TabsTrigger><TabsTrigger value="exercises" className="text-xs sm:text-sm">Exercices</TabsTrigger>',
              '<TabsTrigger value="programs" className="text-xs sm:text-sm">Programmes</TabsTrigger><TabsTrigger value="archived" className="text-xs sm:text-sm"><Archive className="size-3 mr-1" />Archivés</TabsTrigger><TabsTrigger value="exercises" className="text-xs sm:text-sm">Exercices</TabsTrigger>',
              'archive tab trigger',
          )
          replace_once(
              '<TabsContent value="programs"><ProgramsTab progs={progs} setProgs={setProgs} exs={exs} onOpenExercise={openOverload} /></TabsContent>',
              '<TabsContent value="programs"><ProgramsTab progs={progs} setProgs={setProgs} exs={exs} onOpenExercise={openOverload} showArchived={false} /></TabsContent><TabsContent value="archived"><ProgramsTab progs={progs} setProgs={setProgs} exs={exs} onOpenExercise={openOverload} showArchived /></TabsContent>',
              'archive tab content',
          )
          replace_once(
              'const ProgramsTab = memo(function ProgramsTab({ progs, setProgs, exs, onOpenExercise }: { progs: Program[]; setProgs: (v: Program[] | ((p: Program[]) => Program[])) => void; exs: Exercise[]; onOpenExercise: (exerciseId: string) => void }) {',
              'const ProgramsTab = memo(function ProgramsTab({ progs, setProgs, exs, onOpenExercise, showArchived }: { progs: Program[]; setProgs: (v: Program[] | ((p: Program[]) => Program[]) => Program[])) => void; exs: Exercise[]; onOpenExercise: (exerciseId: string) => void; showArchived: boolean }) {',
              'ProgramsTab signature',
          )
          replace_once(
              '  const opened = progs.find((p) => p.id === openedId) ?? null;',
              '  const visibleProgs = progs.filter((p) => Boolean(p.isArchived) === showArchived);\n  const opened = visibleProgs.find((p) => p.id === openedId) ?? null;',
              'visible programs',
          )
          replace_once(
              '    if (!active) return;\n    const ended = Date.now();',
              '    if (!active) return;\n    const ended = Date.now();',
              'noop anchor',
          )
          replace_once(
              '{progs.map((p) => <div key={p.id} className="rounded-xl glass-thin p-3">',
              '{visibleProgs.map((p) => <div key={p.id} className="rounded-xl glass-thin p-3">',
              'program list',
          )
          replace_once(
              '<button onClick={() => { setEditing(p); setOpen(true); }} className="text-muted-foreground hover:text-foreground"><Pencil className="size-3.5" /></button><button onClick={() => setProgs((prev) => prev.filter((x) => x.id !== p.id))} aria-label={`Supprimer le programme ${p.name}`} className="text-muted-foreground hover:text-destructive"><Trash2 className="size-3.5" /></button>',
              '<button onClick={() => { setEditing(p); setOpen(true); }} className="text-muted-foreground hover:text-foreground"><Pencil className="size-3.5" /></button><button onClick={() => setProgs((prev) => prev.map((x) => x.id === p.id ? { ...x, isArchived: !x.isArchived } : x))} aria-label={p.isArchived ? `Restaurer le programme ${p.name}` : `Archiver le programme ${p.name}`} className="text-muted-foreground hover:text-foreground">{p.isArchived ? <ArchiveRestore className="size-3.5" /> : <Archive className="size-3.5" />}</button><button onClick={() => setProgs((prev) => prev.filter((x) => x.id !== p.id))} aria-label={`Supprimer le programme ${p.name}`} className="text-muted-foreground hover:text-destructive"><Trash2 className="size-3.5" /></button>',
              'archive action',
          )
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/sport.tsx
          git diff --cached --quiet || git commit -m 'feat(sport): add archived programs tab'
          git push
      - name: Remove one-time patch workflow
        if: success()
        run: |
          git rm .github/workflows/patch-sport-archive.yml
          git commit -m 'chore: remove one-time sport archive patch workflow'
          git push
