name: Temporary Bun lockfile refresh

on:
  push:
    branches: [fix/native-account-scoped-local-store]

permissions:
  contents: write

jobs:
  refresh-bun-lock:
    if: contains(github.event.head_commit.message, '[refresh bun lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve patched TanStack dependencies
        run: bun install
      - name: Verify fixed versions
        run: |
          node <<'NODE'
          const lock = require('./bun.lock');
          const packages = lock.packages || {};
          const start = packages['@tanstack/react-start']?.[0]?.split('@').pop();
          const core = packages['@tanstack/start-server-core']?.[0]?.split('@').pop();
          const parse = (value) => String(value || '').split('.').map(Number);
          const atLeast = (actual, minimum) => {
            const a = parse(actual), b = parse(minimum);
            for (let i = 0; i < 3; i++) {
              if ((a[i] || 0) > (b[i] || 0)) return true;
              if ((a[i] || 0) < (b[i] || 0)) return false;
            }
            return true;
          };
          if (!atLeast(start, '1.168.60')) throw new Error('Unpatched @tanstack/react-start: ' + start);
          if (!atLeast(core, '1.169.39')) throw new Error('Unpatched @tanstack/start-server-core: ' + core);
          console.log({ reactStart: start, startServerCore: core });
          NODE
      - name: Commit refreshed Bun lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Bun lockfile already up to date"
          else
            git commit -m "chore: refresh TanStack Bun lockfile"
            git push
          fi
