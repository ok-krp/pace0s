name: Temporary Bun lockfile refresh

on:
  push:
    branches: [fix/native-account-scoped-local-store]

permissions:
  contents: write

jobs:
  refresh-bun-lock:
    if: contains(github.event.head_commit.message, '[refresh bun lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve patched TanStack dependencies
        run: bun install
      - name: Verify fixed versions
        shell: bash
        run: |
          set -euo pipefail
          start="$(grep -oE '"@tanstack/react-start@[^"]+"' bun.lock | head -n 1 | sed -E 's/.*@([0-9]+\.[0-9]+\.[0-9]+)"/\1/')"
          core="$(grep -oE '"@tanstack/start-server-core@[^"]+"' bun.lock | head -n 1 | sed -E 's/.*@([0-9]+\.[0-9]+\.[0-9]+)"/\1/')"
          at_least() {
            local actual="$1" minimum="$2" lowest
            lowest="$(printf '%s\n%s\n' "$minimum" "$actual" | sort -V | head -n 1)"
            [ "$lowest" = "$minimum" ]
          }
          echo "Resolved @tanstack/react-start=$start"
          echo "Resolved @tanstack/start-server-core=$core"
          at_least "$start" "1.168.60" || { echo "::error::Unpatched @tanstack/react-start: $start"; exit 1; }
          at_least "$core" "1.169.39" || { echo "::error::Unpatched @tanstack/start-server-core: $core"; exit 1; }
      - name: Commit refreshed Bun lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Bun lockfile already up to date"
          else
            git commit -m "chore: refresh TanStack Bun lockfile"
            git push
          fi
