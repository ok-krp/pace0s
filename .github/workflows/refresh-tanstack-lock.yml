name: Temporary TanStack lockfile refresh

on:
  push:
    branches: [fix/native-account-scoped-local-store]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, '[refresh tanstack lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
      - name: Resolve patched TanStack dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify fixed versions
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const start = packages['node_modules/@tanstack/react-start']?.version;
          const core = packages['node_modules/@tanstack/start-server-core']?.version;
          const parse = (value) => String(value || '').split('.').map(Number);
          const atLeast = (actual, minimum) => {
            const a = parse(actual), b = parse(minimum);
            for (let i = 0; i < 3; i++) {
              if ((a[i] || 0) > (b[i] || 0)) return true;
              if ((a[i] || 0) < (b[i] || 0)) return false;
            }
            return true;
          };
          if (!atLeast(start, '1.168.60')) throw new Error('Unpatched @tanstack/react-start: ' + start);
          if (!atLeast(core, '1.169.39')) throw new Error('Unpatched @tanstack/start-server-core: ' + core);
          console.log({ reactStart: start, startServerCore: core });
          NODE
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
          else
            git commit -m "chore: refresh TanStack security lockfile"
            git push
          fi
