name: Temporary Transformers security lock refresh

on:
  push:
    branches: [fix/paceos-comprehensive-audit-2026-10]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, '[refresh transformers lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
      - name: Resolve the pinned Transformers release
        run: bun install
      - name: Verify Bun lock resolution
        shell: bash
        run: |
          grep -Fq '"@huggingface/transformers@4.3.1"' bun.lock || {
            echo "::error::bun.lock does not resolve @huggingface/transformers@4.3.1"
            grep -n -A2 -B2 '@huggingface/transformers' bun.lock || true
            exit 1
          }
          if grep -Fq '"@huggingface/transformers@4.2.0"' bun.lock; then
            echo "::error::bun.lock still contains vulnerable @huggingface/transformers@4.2.0"
            exit 1
          fi
          echo "Verified @huggingface/transformers@4.3.1 in bun.lock"
      - name: Audit production dependencies
        run: |
          npm install --ignore-scripts --legacy-peer-deps --omit=dev --no-fund
          npm audit --omit=dev || echo '::warning::Production audit still reports advisories; inspect this job log before merging.'
      - name: Commit refreshed Bun lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Bun lockfile already up to date"
          else
            git commit -m "chore: refresh Transformers security lockfile"
            git push
          fi
