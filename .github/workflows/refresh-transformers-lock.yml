name: Temporary Transformers security lock refresh

on:
  push:
    branches: [fix/paceos-comprehensive-audit-2026-10]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, '[refresh transformers lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
      - name: Resolve the pinned Transformers release
        run: bun install
      - name: Verify Bun lock resolution
        run: |
          node <<'NODE'
          const lock = JSON.parse(require('fs').readFileSync('./bun.lock', 'utf8'));
          const entry = lock.packages?.['@huggingface/transformers']?.[0];
          const version = entry?.split('@').pop();
          if (version !== '4.3.1') throw new Error('Expected @huggingface/transformers 4.3.1, found ' + version);
          console.log({ transformers: version });
          NODE
      - name: Audit production dependencies
        run: |
          npm install --ignore-scripts --legacy-peer-deps --omit=dev --no-fund --no-package-lock
          npm audit --omit=dev
      - name: Commit refreshed Bun lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Bun lockfile already up to date"
          else
            git commit -m "chore: refresh Transformers security lockfile"
            git push
          fi
