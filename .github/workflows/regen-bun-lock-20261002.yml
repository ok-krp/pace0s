name: Regenerate Bun lockfile

on:
  push:
    branches:
      - fix/p0-stability-themes-sync-nutrition-ai
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile
        run: bun install --lockfile-only
      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/regen-bun-lock-20261002.yml
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git commit -m "fix(deps): regenerate Bun lockfile for patched TanStack Start"
          git push
