name: Regenerate TanStack lockfile

on:
  push:
    branches:
      - security/phase-a-secret-hardening

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'chore(ci): regenerate TanStack lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Regenerate lockfile
        run: bun install
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): regenerate TanStack lockfile"
          git push origin HEAD:security/phase-a-secret-hardening
