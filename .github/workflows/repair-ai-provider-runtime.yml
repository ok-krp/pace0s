name: Repair AI provider runtime

on:
  push:
    branches: [fix/ai-provider-runtime-errors]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch provider error handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ai-provider.server.ts')
          s = p.read_text()
          old = 'function providerError(error: unknown) { const status = typeof error === "object" && error !== null && "status" in error && typeof error.status === "number" ? error.status : 0;'
          new = '''function providerError(error: unknown) {
            const candidate = error as { status?: unknown; statusCode?: unknown; response?: { status?: unknown }; cause?: { status?: unknown; statusCode?: unknown } } | null;
            const rawStatus = candidate && typeof candidate === "object" ? candidate.status ?? candidate.statusCode ?? candidate.response?.status ?? candidate.cause?.status ?? candidate.cause?.statusCode : undefined;
            const status = typeof rawStatus === "number" ? rawStatus : typeof rawStatus === "string" && /^\\d+$/.test(rawStatus) ? Number(rawStatus) : 0;'''
          if old not in s:
              raise SystemExit('providerError target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai-provider.server.ts
          git diff --cached --quiet || git commit -m "fix(ai): preserve provider error status codes"
          git push
