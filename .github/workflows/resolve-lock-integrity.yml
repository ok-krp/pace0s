name: Resolve lock integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Clean-cache frozen install
        env:
          BUN_INSTALL_CACHE_DIR: /tmp/pace-bun-cache
        run: |
          rm -rf "$BUN_INSTALL_CACHE_DIR"
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          bun install --frozen-lockfile
