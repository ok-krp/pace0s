name: Resolve lock integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --lockfile-only
      - name: Show TanStack resolutions
        run: |
          grep -n '"@tanstack/react-router@' bun.lock
          grep -n '"@tanstack/router-plugin@' bun.lock
