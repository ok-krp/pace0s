name: Resolve lock integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --lockfile-only
      - name: Commit regenerated lockfile and remove helper workflow
        shell: bash
        run: |
          cp bun.lock /tmp/generated-bun.lock
          git fetch origin fix/p0-stability-themes-sync-nutrition-ai
          git checkout -B fix/p0-stability-themes-sync-nutrition-ai origin/fix/p0-stability-themes-sync-nutrition-ai
          cp /tmp/generated-bun.lock bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/resolve-lock-integrity.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "ci: regenerate bun lockfile"
          git push origin HEAD:fix/p0-stability-themes-sync-nutrition-ai
