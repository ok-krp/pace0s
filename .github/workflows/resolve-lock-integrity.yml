name: Resolve lock integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect npm tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack @tanstack/react-router@1.170.41 --silent
          file=$(ls tanstack-react-router-1.170.41.tgz)
          echo "tarball=$file"
          sha512sum "$file"
          npm view @tanstack/react-router@1.170.41 dist.integrity
