name: Pace SaaS Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bun 1.4.x currently rejects this project's TanStack Router tarball
      # during integrity extraction even though npm registry integrity matches.
      # Use npm for CI installation; application runtime/build remains unchanged.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
