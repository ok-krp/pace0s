name: Pace SaaS Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/paceos-comprehensive-audit-2026-10]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify Bun lockfile format and resolved Transformers.js version
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');

          // Bun's bun.lock is JSONC-like: valid lockfiles may contain trailing
          // commas, so JSON.parse(rawText) incorrectly rejects the real format.
          const raw = fs.readFileSync('bun.lock', 'utf8');
          let normalized = '';
          let inString = false;
          let escaped = false;
          for (let i = 0; i < raw.length; i += 1) {
            const ch = raw[i];
            if (inString) {
              normalized += ch;
              if (escaped) escaped = false;
              else if (ch === '\\') escaped = true;
              else if (ch === '"') inString = false;
              continue;
            }
            if (ch === '"') {
              inString = true;
              normalized += ch;
              continue;
            }
            if (ch === ',') {
              let next = i + 1;
              while (next < raw.length && /\s/.test(raw[next])) next += 1;
              if (raw[next] === '}' || raw[next] === ']') continue;
            }
            normalized += ch;
          }

          let lock;
          try {
            lock = JSON.parse(normalized);
          } catch (error) {
            console.error('bun.lock is not valid Bun JSONC-like lockfile syntax:', error.message);
            process.exit(1);
          }

          if (![1, 2].includes(lock.lockfileVersion)) {
            throw new Error(`Unsupported bun.lock lockfileVersion: ${lock.lockfileVersion}`);
          }
          const packageName = '@huggingface/transformers';
          const declared = lock.workspaces?.['']?.dependencies?.[packageName];
          const resolved = lock.packages?.[packageName]?.[0];
          if (declared !== '4.3.1') {
            throw new Error(`bun.lock workspace dependency expected 4.3.1, got ${declared ?? 'missing'}`);
          }
          if (resolved !== `${packageName}@4.3.1`) {
            throw new Error(`bun.lock resolved package expected ${packageName}@4.3.1, got ${resolved ?? 'missing'}`);
          }
          console.log(`Validated Bun lockfile v${lock.lockfileVersion}: ${resolved}`);
          NODE
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test:rich-note-sanitization
      - run: bun run lint
