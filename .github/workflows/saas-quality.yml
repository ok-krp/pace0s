name: Pace SaaS Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint

  regenerate_tanstack_lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/phase-a-secret-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/phase-a-secret-hardening
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Regenerate lockfile and remove temporary workflow
        run: |
          bun install
          git show HEAD^:.github/workflows/saas-quality.yml > .github/workflows/saas-quality.yml
          git rm .github/workflows/regenerate-tanstack-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock .github/workflows/saas-quality.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): regenerate TanStack lockfile"
          git push origin HEAD:security/phase-a-secret-hardening
