name: Security

on:
  pull_request:
  push:
    branches: [main, fix/paceos-comprehensive-audit-2026-10]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret scan (history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The action hard-fails when GitHub's Dependency Graph feature is disabled.
      # Probe the SBOM endpoint first so the workflow reports the missing repository
      # setting clearly instead of marking the entire security workflow as failed.
      - name: Check GitHub Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /tmp/dependency-graph-sbom.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph is disabled or unavailable for this repository. Dependency Review was skipped; enable it in Settings → Code security and analysis. The separate locked production dependency audit still runs."
          else
            echo "::error::Could not verify Dependency Graph availability (GitHub API HTTP $status)."
            exit 1
          fi
      - uses: actions/dependency-review-action@v4
        if: steps.dependency-graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high

  audit:
    name: Bun lockfile audit (production, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # bun audit reads the committed bun.lock directly. Do not use npm install
      # here: without package-lock.json, npm would resolve a different dependency
      # graph and the audit would not describe the reproducible production lock.
      - name: Audit locked production dependencies
        run: bun audit --prod
