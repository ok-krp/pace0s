name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret scan (history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The action hard-fails when GitHub's Dependency Graph feature is disabled.
      # Probe the SBOM endpoint first so the workflow reports the missing repository
      # setting clearly instead of marking the entire security workflow as failed.
      - name: Check GitHub Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /tmp/dependency-graph-sbom.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph is disabled or unavailable for this repository. Dependency Review was skipped; enable it in Settings → Code security and analysis. The separate production npm audit still runs."
          else
            echo "::error::Could not verify Dependency Graph availability (GitHub API HTTP $status)."
            exit 1
          fi
      - uses: actions/dependency-review-action@v4
        if: steps.dependency-graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high

  audit:
    name: npm audit (production, informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --legacy-peer-deps --omit=dev --no-fund
      - name: Report production dependency vulnerabilities (informational)
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high
          audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning::npm audit found production dependency advisories or could not complete (exit $audit_status). Review the audit output above; this informational step does not block CI."
          fi
          exit 0
