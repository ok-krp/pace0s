name: Pace sync audit

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/test-sync-policy.mjs"
      - "package.json"
      - ".github/workflows/sync-audit.yml"

jobs:
  sync-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/test-sync-policy.mjs
      - run: npm run test:health-e2ee-realtime
      - run: npm run test:nutrition-sync-auto-reconcile
      # TanStack Router generates src/routeTree.gen.ts during the Vite build.
      # Run the build before typecheck so newly added file routes are included.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
