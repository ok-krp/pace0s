name: Pace sync audit

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/cloud-sync-contract-test.mjs"
      - "scripts/test-sync-policy.mjs"
      - "scripts/health-e2ee-realtime-contract-test.mjs"
      - "scripts/real-auth-multi-device-test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/sync-audit.yml"
  push:
    branches:
      - "fix/health-egress-consent-reads"
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/cloud-sync-contract-test.mjs"
      - "scripts/test-sync-policy.mjs"
      - "scripts/health-e2ee-realtime-contract-test.mjs"
      - "scripts/real-auth-multi-device-test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/sync-audit.yml"

jobs:
  sync-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:sync
      - run: bun run test:health-e2ee-realtime
      - run: bun run build
      - run: bun run lint
      - run: bun run typecheck

  real-auth-multi-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run real authenticated A -> Realtime -> B -> B -> Realtime -> A test
        env:
          SUPABASE_URL: https://cduyjejftorfuxuwhbqt.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_HWlyOrqPkDAdibQIKl-RCQ_i8ihwcyO
          E2E_TEST_EMAIL: ${{ secrets.PACEOS_E2E_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.PACEOS_E2E_PASSWORD }}
        run: bun run scripts/real-auth-multi-device-test.ts
