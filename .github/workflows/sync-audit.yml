name: Pace sync audit

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/cloud-sync-contract-test.mjs"
      - "scripts/test-sync-policy.mjs"
      - "scripts/health-e2ee-realtime-contract-test.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/sync-audit.yml"

jobs:
  sync-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:sync
      - run: bun run test:health-e2ee-realtime
      # TanStack Router generates src/routeTree.gen.ts during the Vite build.
      # Run the build before typecheck so newly added file routes are included.
      - run: bun run build
      - run: bun run lint
      - run: bun run typecheck
