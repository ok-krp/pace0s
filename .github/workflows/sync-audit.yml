name: Pace sync audit

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/test-sync-policy.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sync-audit.yml"

jobs:
  sync-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-sync-policy.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
