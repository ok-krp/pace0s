name: TanStack SSR compatibility

on:
  push:
    branches: [fix/main-tanstack-start-alignment-20261115]
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "scripts/tanstack-start-compat-test.mjs"
      - ".github/workflows/tanstack-ssr-compat.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from the pinned package manifest
        run: bun install --lockfile-only
      - name: Commit the generated Bun lockfile on the isolated branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh Bun lock for TanStack Start [skip ci]"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH_NAME}"
          fi
      - name: Verify resolved TanStack packages and removed API usage
        run: node scripts/tanstack-start-compat-test.mjs
      - name: Install exactly from the regenerated lockfile
        run: bun install --frozen-lockfile
      - run: bun run test:sync
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
