name: Typecheck diagnostic
on:
  workflow_dispatch:
  push:
    branches: [fix/supabase-sync-nutrition]
    paths:
      - '.github/workflows/typecheck-diagnostic.yml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run typecheck and capture diagnostics
        run: |
          set +e
          npm run typecheck -- --pretty false 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 1
