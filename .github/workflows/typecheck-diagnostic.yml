name: Typecheck diagnostic
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typecheck-diagnostic.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > typecheck-diagnostic.txt 2>&1
          status=$?
          exit "$status"
      - name: Publish diagnostics to branch
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-diagnostic.txt
          git commit -m "ci: publish temporary typecheck diagnostics" || exit 0
          git push origin HEAD:${{ github.head_ref }}
