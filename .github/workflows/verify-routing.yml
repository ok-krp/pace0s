name: Verify Pace routing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle and generate TanStack route tree
        run: npm run build

      - name: Verify generated route tree contains application routes
        shell: bash
        run: |
          test -f src/routeTree.gen.ts
          for route in "/" "/assistant" "/development" "/ai-activity" "/nutrition" "/sport" "/watch" "/sleep" "/routine" "/body" "/work" "/calendar" "/notes" "/recalls" "/finance" "/profile" "/settings" "/scan" "/recipes" "/investments" "/water" "/login"; do
            if [ "$route" = "/" ]; then
              grep -q 'path: "/"' src/routeTree.gen.ts || { echo "Missing route: /"; exit 1; }
            else
              grep -q "path: \"$route\"\|path: '$route'" src/routeTree.gen.ts || { echo "Missing route: $route"; exit 1; }
            fi
          done

      - name: Commit regenerated route tree when changed
        shell: bash
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "routeTree.gen.ts is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore(routing): regenerate TanStack route tree"
          git push
