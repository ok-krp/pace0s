name: Verify Pace routing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # TanStack Router generates src/routeTree.gen.ts during the Vite build.
      # Run the build before typecheck so newly-added file routes are part of
      # FileRoutesByPath when TypeScript validates createFileRoute(...).
      - name: Generate route tree and build production bundle
        run: npm run build

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Verify generated TanStack route tree
        shell: bash
        run: |
          test -f src/routeTree.gen.ts
          grep -Fq "IndexRouteImport" src/routeTree.gen.ts || { echo "Missing index route in route tree"; exit 1; }
          for route in "/assistant" "/development" "/ai-activity" "/nutrition" "/courses" "/sport" "/watch" "/sleep" "/routine" "/body" "/work" "/calendar" "/notes" "/recalls" "/finance" "/profile" "/settings" "/scan" "/recipes" "/investments" "/water" "/login"; do
            grep -Fq "'$route'" src/routeTree.gen.ts || grep -Fq "\"$route\"" src/routeTree.gen.ts || {
              echo "Missing route in generated tree: $route"
              exit 1
            }
          done
          echo "All expected application routes are present."

      - name: Verify route tree is generated
        shell: bash
        run: |
          test -s src/routeTree.gen.ts
          echo "TanStack route tree generated successfully."
