name: pace

description: Native cross-platform Pace application. The existing React web application remains untouched during migration.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.3
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.5.0
  health: ^13.3.1
  flutter_local_notifications: ^22.3.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
